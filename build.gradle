plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.voxellight'
version = mod_version

base {
    archivesName = "voxellight-client-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        voxellight {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    dependsOn tasks.named('jar')
    classpath += files(tasks.named('jar').flatMap { it.archiveFile })
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        systemProperty 'voxellight.modJar', tasks.jar.archiveFile.get().asFile.absolutePath
    }
}

// Verify version-specific hooks and compile shaders without starting a game/window.
sourceSets.test.compileClasspath += sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.runtimeClasspath

processResources {
    inputs.file('src/main/resources/assets/voxellight/shaders/environment.glsl')
    inputs.file('src/main/resources/assets/voxellight/shaders/motion.glsl')
    inputs.file('src/main/resources/assets/voxellight/shaders/motion_reuse.glsl')
    filesMatching('assets/voxellight/shaders/*.fsh') {
        filter { line -> line == '// VOXELLIGHT_ENVIRONMENT_FUNCTIONS' ? file('src/main/resources/assets/voxellight/shaders/environment.glsl').text : line == '// VOXELLIGHT_MOTION_FUNCTIONS' ? file('src/main/resources/assets/voxellight/shaders/motion.glsl').text : line == '// VOXELLIGHT_MOTION_REUSE' ? file('src/main/resources/assets/voxellight/shaders/motion_reuse.glsl').text : line }
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.register('clientKit', Zip) {
    dependsOn tasks.named('jar'), tasks.named('check')
    archiveFileName = "voxellight-client-kit-${minecraft_version}-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'mods' }
    from('docs/INSTALL.md') { rename { 'INSTALL.md' } }
    from('docs/RT-ENVIRONMENT.md')
    from('docs/SETTINGS.md')
    from('docs/MATERIAL-3.md')
    from('docs/RT-LIGHT-TRANSPORT.md')
    from('docs/VULKAN-RT-MIGRATION.md')
    from('docs/performance/RT-EXECUTION-ROUND-1.md')
    from('docs/performance/RT-AUTOMATIC-BENCHMARK.md')
    from('docs/performance/RT-DIRECT-LIGHTING-ROUND-2.md')
}

// Legacy CUDA/OptiX tracing artifacts must never leak from a previous local build.
jar { exclude 'voxellight/native/**' }

// Vulkan RT stage binaries are produced/validated before packaging, never compiled in game.
tasks.register('compileVulkanRt', Exec) {
    inputs.dir('shaders/rt')
    inputs.file('tools/build_vulkan_rt.py')
    inputs.property('slangc', System.getenv('SLANGC') ?: 'slangc')
    outputs.dir(layout.buildDirectory.dir('vulkan-rt'))
    commandLine 'python3', 'tools/build_vulkan_rt.py'
}
processResources {
    dependsOn tasks.named('compileVulkanRt')
    from(layout.buildDirectory.dir('vulkan-rt')) { into 'assets/voxellight/rt/vulkan' }
}

// Numerical parity executes the actual Slang CPU target against existing native Material 3.
tasks.register('verifyVulkanTransport', Exec) {
    dependsOn tasks.named('compileJava')
    inputs.files('src/main/java/com/voxellight/rt/RtLightRuntime.java','src/main/java/com/voxellight/rt/RtEmitterTable.java','tools/native/GenerateLightRuntime.java','tools/native/vulkan_direct_lighting.cpp')
    inputs.dir('shaders/rt/common')
    inputs.dir('shaders/rt/tests')
    inputs.files('native/rt/bsdf.h', 'native/rt/ggx_energy.h', 'native/rt/material.cuh', 'native/rt/surface.h', 'native/rt/water_surface.h', 'tools/verify_vulkan_transport.py', 'tools/native/vulkan_transport_parity.cpp', 'tools/native/vulkan_terrain_material_parity.cpp', 'native/rt/environment.h', 'tools/native/vulkan_environment_parity.cpp', 'tools/build_vulkan_rt.py', 'tools/native/vulkan_visibility_transport.cpp', 'tools/native/vulkan_path_storage.cpp', 'tools/native/vulkan_continuation_queue.cpp', 'tools/native/vulkan_numerical_edges.cpp', 'tools/native/vulkan_emitter_sampling.cpp', 'tools/native/vulkan_flame_sampling.cpp', 'tools/native/vulkan_reconstruction_fixture.cpp', 'src/main/resources/assets/voxellight/shaders/rt_denoiser_guides.fsh', 'src/main/resources/assets/voxellight/shaders/rt_reconstruct.fsh', 'src/main/resources/assets/voxellight/shaders/vulkan_rt_accumulate.fsh')
    outputs.file(layout.buildDirectory.file('vulkan-transport-parity/result.txt'))
    commandLine 'python3', 'tools/verify_vulkan_transport.py'
}
tasks.named('check') { dependsOn tasks.named('verifyVulkanTransport') }

// Host-only denoiser bridge. NVIDIA runtime remains optional and failure uses Vulkan reconstruction.
tasks.register('compileOptixDenoiser', Exec) {
    inputs.dir('native/denoiser')
    inputs.file('tools/build_optix_denoiser.py')
    outputs.dir(layout.buildDirectory.dir('optix-denoiser'))
    commandLine 'python3', 'tools/build_optix_denoiser.py'
}
processResources {
    dependsOn tasks.named('compileOptixDenoiser')
    from(layout.buildDirectory.dir('optix-denoiser')) { into 'voxellight/denoiser' }
}
