plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.voxellight'
version = mod_version

base {
    archivesName = "voxellight-client-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        voxellight {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    doFirst {
        systemProperty 'voxellight.modJar', tasks.jar.archiveFile.get().asFile.absolutePath
    }
}

// Verify version-specific hooks and compile shaders without starting a game/window.
sourceSets.test.compileClasspath += sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.runtimeClasspath

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.register('clientKit', Zip) {
    dependsOn tasks.named('jar'), tasks.named('check')
    archiveFileName = "voxellight-client-kit-${minecraft_version}-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'mods' }
    from('docs/INSTALL.md') { rename { 'INSTALL.md' } }
}
